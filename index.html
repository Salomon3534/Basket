<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b5ce2">
  <title>Basket — Lista de compras</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="logo" href="#" aria-label="Basket, inicio">Basket<span>.</span></a>
    <nav class="nav" aria-label="Navegación principal">
      <button class="active" data-filter="all">🏠 Inicio</button>
      <button data-filter="favorites">⭐ Favoritos</button>
      <button data-filter="pending">🛒 Por comprar</button>
      <button data-filter="offers">💰 Ofertas</button>
    </nav>
    <div class="section-title">CATEGORÍAS</div>
    <nav class="nav" aria-label="Categorías">
      <button data-cat="Tecnología">📱 Tecnología</button>
      <button data-cat="Informática">🖥️ Informática</button>
      <button data-cat="Gaming">🎮 Gaming</button>
      <button data-cat="Hogar">🏠 Hogar</button>
    </nav>
    <div class="section-title">FUENTES</div>
    <nav class="nav">
      <button class="add-source" id="addSource">＋ Añadir fuente</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <label class="search">
        <span aria-hidden="true">🔍</span>
        <input id="search" type="search" aria-label="Buscar productos" placeholder="Buscar productos, marcas o tiendas...">
      </label>
      <div class="avatar" aria-label="Perfil">JR</div>
    </header>

    <section class="hero">
      <div>
        <h1>Mi cesta de compras</h1>
        <p>Todos tus productos y precios en un solo lugar.</p>
      </div>
      <div class="hero-actions">
        <button class="secondary" id="buyAll" type="button">🛒 Comprar todo</button>
        <button class="primary" id="addProduct" type="button">＋ Añadir producto</button>
      </div>
    </section>

    <section class="stats" aria-label="Resumen de productos">
      <div class="stat"><div class="num" id="count">0</div><small>Productos guardados</small></div>
      <div class="stat"><div class="num" id="pending">0</div><small>Por comprar</small></div>
      <div class="stat"><div class="num" id="offers">0</div><small>En oferta</small></div>
    </section>

    <div class="toolbar">
      <h2>Mis productos</h2>
      <label class="sort-label" for="sort">Ordenar por</label>
      <select id="sort">
        <option value="default">Más recientes</option>
        <option value="price">Precio menor</option>
        <option value="discount">Mayor descuento</option>
      </select>
    </div>

    <section class="products" id="products" aria-live="polite"></section>
  </main>
</div>

<div class="modal-back" id="modalBack" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Añadir producto</h2>
    <form id="productForm">
      <label for="name">Nombre del producto</label>
      <input id="name" required placeholder="Ej. Sony WH-1000XM6">
      <label for="brand">Marca</label>
      <input id="brand" placeholder="Ej. Sony">
      <label for="price">Precio actual (€)</label>
      <input id="price" type="number" min="0" step="0.01" required placeholder="299">
      <label for="oldPrice">Precio anterior (€)</label>
      <input id="oldPrice" type="number" min="0" step="0.01" placeholder="349">
      <label for="category">Categoría</label>
      <input id="category" placeholder="Tecnología">
      <label for="url">URL del producto</label>
      <input id="url" type="url" placeholder="https://...">
      <div class="modal-actions">
        <button type="button" class="cancel" id="closeModal">Cancelar</button>
        <button class="primary" type="submit">Guardar producto</button>
      </div>
    </form>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
